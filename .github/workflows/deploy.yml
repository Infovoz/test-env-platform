name: CI/CD Pipeline - Preview Environments

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    types: [opened, synchronize, reopened, closed]

jobs:
  test-environment-pipeline:
    name: Build, Deploy & Verify Test Environment
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout repository code
        uses: actions/checkout@v4

      - name: 2. Start Local Docker Registry
        run: |
          docker run -d -p 5000:5000 --restart=always --name registry registry:2
          sleep 2

      - name: 3. Build & Push Images to Registry
        run: |
          docker build -t 127.0.0.1:5000/testenv-backend:latest ./backend
          docker build -t 127.0.0.1:5000/testenv-frontend:latest ./frontend
          docker push 127.0.0.1:5000/testenv-backend:latest
          docker push 127.0.0.1:5000/testenv-frontend:latest

      - name: 4. Initialize Swarm & Deploy Stack
        run: |
          docker swarm init
          docker stack deploy -c docker-compose.yml testenv
          echo "Ожидание развертывания служб кластера (20 сек)..."
          sleep 20
          docker service ls

      - name: 5. Run Automated Smoke Tests
        run: |
          echo "--- 1. Проверка доступности веб-интерфейса ---"
          curl -s --max-time 10 http://localhost:80/ | head -n 10 || true

          echo "--- 2. Проверка Healthcheck API и БД ---"
          HEALTH=$(curl -s --max-time 10 http://localhost:80/api/health || true)
          echo "Health response: $HEALTH"

          echo "--- 3. Проверка REST API задач ---"
          curl -s --max-time 10 http://localhost:80/api/tasks || true

          echo "ВСЕ ИНФРАСТРУКТУРНЫЕ ТЕСТЫ УСПЕШНО ПРОЙДЕНЫ!"

      - name: 6. Teardown Test Environment
        if: always()
        run: |
          docker stack rm testenv
          sleep 3
          docker swarm leave --force || true