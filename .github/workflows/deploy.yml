name: CI/CD Pipeline - Preview Environments

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    types: [opened, synchronize, reopened, closed]

jobs:
  build:
    name: Build & Push Images
    runs-on: ubuntu-latest
    if: github.event.action != 'closed'
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Start Local Docker Registry
        run: |
          docker run -d -p 5000:5000 --restart=always --name registry registry:2
          sleep 3

      - name: Build & Push Backend Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: 127.0.0.1:5000/testenv-backend:latest

      - name: Build & Push Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: 127.0.0.1:5000/testenv-frontend:latest

  deploy-and-test:
    name: Deploy to Swarm & Verify
    runs-on: ubuntu-latest
    needs: build
    if: github.event.action != 'closed'
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Initialize Docker Swarm Cluster
        run: |
          docker swarm init || true
          docker node ls

      - name: Start Local Registry for Deployment
        run: |
          if [ -z "$(docker ps -q -f name=registry)" ]; then
            docker run -d -p 5000:5000 --restart=always --name registry registry:2
          fi

      - name: Build local images for Swarm stack
        run: |
          docker build -t 127.0.0.1:5000/testenv-backend:latest ./backend
          docker build -t 127.0.0.1:5000/testenv-frontend:latest ./frontend
          docker push 127.0.0.1:5000/testenv-backend:latest
          docker push 127.0.0.1:5000/testenv-frontend:latest

      - name: Deploy Test Environment Stack
        run: |
          docker stack deploy -c docker-compose.yml testenv
          echo "Waiting for all cluster services to converge..."
          sleep 25
          docker service ls
          docker stack ps testenv

      - name: Run Automated Smoke & Healthcheck Tests
        run: |
          echo "1. Тестирование доступности Frontend через Traefik..."
          curl -f -s -o /dev/null -w "%{http_code}\n" http://localhost:80/ | grep 200

          echo "2. Тестирование Backend Healthcheck эндпоинта (/api/health)..."
          HEALTH_RES=$(curl -f -s http://localhost:80/api/health)
          echo "Ответ от /api/health: $HEALTH_RES"
          echo "$HEALTH_RES" | grep -q '"database":"healthy"'

          echo "3. Тестирование выборки данных из БД через API (/api/tasks)..."
          TASKS_RES=$(curl -f -s http://localhost:80/api/tasks)
          echo "Ответ от /api/tasks: $TASKS_RES"

          echo "Все тесты тестового окружения успешно пройдены!"

      - name: Teardown Test Environment
        if: always()
        run: |
          echo "Очистка тестового окружения..."
          docker stack rm testenv
          sleep 5
          docker swarm leave --force || true