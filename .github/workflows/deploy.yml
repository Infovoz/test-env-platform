name: CI/CD Pipeline - Preview Environments

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    types: [opened, synchronize, reopened, closed]

jobs:
  test-environment-pipeline:
    name: Build, Deploy & Verify Test Environment
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout repository code
        uses: actions/checkout@v4

      - name: 2. Start Local Docker Registry
        run: |
          docker run -d -p 5000:5000 --restart=always --name registry registry:2
          sleep 3

      - name: 3. Build Microservices Images
        run: |
          docker build -t 127.0.0.1:5000/testenv-backend:latest ./backend
          docker build -t 127.0.0.1:5000/testenv-frontend:latest ./frontend

      - name: 4. Push Images to Registry
        run: |
          docker push 127.0.0.1:5000/testenv-backend:latest
          docker push 127.0.0.1:5000/testenv-frontend:latest

      - name: 5. Initialize Docker Swarm Cluster
        run: |
          docker swarm init
          docker node ls

      - name: 6. Deploy Test Environment Stack
        run: |
          docker stack deploy -c docker-compose.yml testenv
          echo "Ожидание развертывания служб кластера (25 сек)..."
          sleep 25
          docker service ls

      - name: 7. Run Automated Smoke & Healthcheck Tests
        run: |
          echo "--- Проверка Ingress Proxy и Frontend (HTTP 200) ---"
          curl -f -s -o /dev/null -w "%{http_code}\n" http://localhost:80/ | grep 200

          echo "--- Проверка Backend API и соединения с PostgreSQL ---"
          HEALTH_RES=$(curl -f -s http://localhost:80/api/health)
          echo "Ответ /api/health: $HEALTH_RES"
          echo "$HEALTH_RES" | grep -q '"database":"healthy"'

          echo "--- Проверка выборки данных из БД через REST API ---"
          TASKS_RES=$(curl -f -s http://localhost:80/api/tasks)
          echo "Ответ /api/tasks: $TASKS_RES"

          echo "ВСЕ ИНФРАСТРУКТУРНЫЕ ТЕСТЫ УСПЕШНО ПРОЙДЕНЫ!"

      - name: 8. Teardown Test Environment
        if: always()
        run: |
          echo "Очистка тестовых ресурсов..."
          docker stack rm testenv
          sleep 5
          docker swarm leave --force || true